[project]
name = "bms-visualizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mikepool117", email = "the117pc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4.1",
    "jupyterlab>=4.6.4",
    "kagglehub[polars-datasets]>=1.0.2",
    "matplotlib>=3.11.2",
